<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schichtbuch Bandgalvanik - PC Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #161f2e;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-purple: #8b5cf6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #2d3748;

      /* Anlagen-Farben */
      --anl-801-border: #3b82f6;
      --anl-801-bg: #131c2e;
      --anl-802-border: #10b981;
      --anl-802-bg: #0f2520;
      --anl-803-border: #8b5cf6;
      --anl-803-bg: #1c172d;
      --anl-804-border: #f59e0b;
      --anl-804-bg: #271d10;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 10px 14px; font-size: 12px; }
    .container { max-width: 1800px; margin: 0 auto; padding-bottom: 10px; }
    
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 1.35rem; color: #ffffff; font-weight: 700; letter-spacing: 0.5px; }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    .card { background: var(--card-bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--border-color); }
    .card-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; padding-bottom: 3px; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; }
    .card-title.red { border-bottom-color: var(--accent-red); }
    .card-title.green { border-bottom-color: var(--accent-green); }
    .card-title.orange { border-bottom-color: var(--accent-orange); }

    label { display: block; font-size: 0.74rem; color: var(--text-muted); margin-top: 4px; margin-bottom: 2px; font-weight: 500; }
    input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 6px 8px; background: #0b111e; border: 1px solid var(--border-color); border-radius: 5px; color: #fff; font-size: 0.82rem; outline: none; }
    input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }
    
    textarea { 
      resize: vertical; 
      min-height: 42px; 
      field-sizing: content;
      line-height: 1.3;
    }

    /* Checkbox Styling */
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: #0b111e;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      cursor: pointer;
      margin-top: 4px;
    }
    .checkbox-container input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-green);
      cursor: pointer;
    }
    .checkbox-container span {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    
    .top-meta-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
    }
    .top-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: center;
    }

    /* PC 4-Spalten Layout für Anlagen */
    .pc-anlagen-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 6px;
    }

    .anlage-column {
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      padding: 8px;
      border: 2px solid var(--border-color);
      background: rgba(22, 31, 46, 0.7);
    }

    .anlage-column.col-801 { border-color: var(--anl-801-border); background: var(--anl-801-bg); }
    .anlage-column.col-802 { border-color: var(--anl-802-border); background: var(--anl-802-bg); }
    .anlage-column.col-803 { border-color: var(--anl-803-border); background: var(--anl-803-bg); }
    .anlage-column.col-804 { border-color: var(--anl-804-border); background: var(--anl-804-bg); }

    .anlage-header-badge {
      text-align: center;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 5px;
      border-radius: 5px;
      color: #ffffff;
      margin-bottom: 8px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .col-801 .anlage-header-badge { background: var(--anl-801-border); }
    .col-802 .anlage-header-badge { background: var(--anl-802-border); }
    .col-803 .anlage-header-badge { background: var(--anl-803-border); }
    .col-804 .anlage-header-badge { background: var(--anl-804-border); }

    .action-buttons-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      padding: 10px;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .btn-submit { 
      flex: 1;
      max-width: 450px;
      padding: 11px 20px; 
      background: var(--accent-blue); 
      color: #fff; 
      border: none; 
      border-radius: 6px; 
      font-size: 0.95rem; 
      font-weight: bold; 
      cursor: pointer; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #2563eb; }

    .btn-reset { 
      flex: 1;
      max-width: 450px;
      padding: 11px 20px; 
      background: #374151; 
      color: var(--text-main); 
      border: none; 
      border-radius: 6px; 
      font-size: 0.95rem; 
      font-weight: bold; 
      cursor: pointer; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-reset:hover { background: #4b5563; }

    .btn-archive, .btn-personnel { 
      padding: 8px 16px; 
      background: #2563eb; 
      color: #fff; 
      border: none; 
      border-radius: 6px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 0.85rem; 
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-personnel { background: #4b5563; }
    .btn-archive:hover { background: #1d4ed8; }
    .btn-personnel:hover { background: #374151; }

    .edit-mode-banner {
      display: none;
      background: var(--accent-orange);
      color: #000;
      font-weight: bold;
      padding: 7px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      text-align: center;
      font-size: 0.85rem;
    }
    .btn-cancel-edit {
      background: #000;
      color: #fff;
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-left: 10px;
      cursor: pointer;
    }

    /* Modal / Archiv & Personal CSS */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: var(--card-bg); border-radius: 8px; width: 100%; max-width: 550px; max-height: 85vh; display: flex; flex-direction: column; border: 1px solid var(--border-color); padding: 14px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
    .modal-title { font-size: 1.05rem; font-weight: bold; color: #fff; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
    
    .archive-search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0b111e;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      margin-bottom: 10px;
    }
    .archive-search-box label { margin: 0; font-weight: bold; white-space: nowrap; color: var(--text-main); }
    .archive-search-box input[type="date"] { flex: 1; padding: 5px; }
    .btn-reset-filter { background: #374151; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.75rem; white-space: nowrap; }

    .archive-list, .personnel-list { overflow-y: auto; flex: 1; margin-bottom: 8px; }
    
    .archive-item, .personnel-item {
      background: #0b111e;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      padding: 8px 12px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .archive-info { font-size: 0.82rem; flex: 1; }
    .archive-date { font-weight: bold; color: var(--accent-blue); }
    .archive-actions { display: flex; gap: 6px; align-items: center; }
    
    .btn-load { background: var(--accent-green); color: #fff; border: none; padding: 5px 9px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-delete-item { background: #dc2626; color: #fff; border: none; padding: 5px 7px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }

    .personnel-add-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 6px;
      margin-bottom: 10px;
      background: #0b111e;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .btn-add-personnel {
      background: var(--accent-green);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .confirm-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .btn-modal-action { padding: 10px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-modal-primary { background: var(--accent-blue); color: #fff; }
    .btn-modal-secondary { background: #4b5563; color: #fff; }
    .btn-modal-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }

    /* =========================================================
       PDF DESIGN (A4 Querformat: 1123px x 794px)
       ========================================================= */
    #pdf-container {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1123px;
      background: #ffffff;
      color: #1f2937;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    .pdf-page {
      width: 1123px;
      height: 794px;
      padding: 25px;
      background: #ffffff;
      box-sizing: border-box;
      position: relative;
    }

    .pdf-header {
      background: #1e293b;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pdf-header h2 { font-size: 15pt; font-weight: bold; }
    .pdf-header .badge { background: #3b82f6; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 10pt; font-weight: bold; }

    .pdf-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .pdf-meta-item label { font-size: 7pt; text-transform: uppercase; color: #64748b; font-weight: bold; display: block; }
    .pdf-meta-item div { font-size: 9.5pt; font-weight: 600; color: #0f172a; }

    .pdf-anlagen-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .pdf-anlage-card {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 8pt;
    }

    .pdf-anlage-title {
      background: #0f172a;
      color: #ffffff;
      font-weight: bold;
      text-align: center;
      padding: 5px;
      font-size: 9.5pt;
    }

    .pdf-card-body { padding: 6px; flex: 1; display: flex; flex-direction: column; gap: 6px; }

    .pdf-block {
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      padding: 5px;
      border-radius: 4px;
      min-height: 28px;
    }

    .pdf-block-title {
      font-size: 7pt;
      font-weight: bold;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 2px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 2px;
    }

    .pdf-block-title.red { color: #dc2626; border-bottom-color: #fca5a5; }
    .pdf-block-title.green { color: #059669; border-bottom-color: #6ee7b7; }
    .pdf-block-title.orange { color: #d97706; border-bottom-color: #fcd34d; }

    .pdf-val { font-size: 8pt; color: #1e293b; white-space: pre-wrap; word-break: break-word; }

    .pdf-footer {
      position: absolute;
      bottom: 12px;
      left: 25px;
      right: 25px;
      border-top: 1px solid #e2e8f0;
      padding-top: 5px;
      display: flex;
      justify-content: space-between;
      font-size: 7pt;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<!-- Datalist für Bediener-Drop-Down / Vorschläge -->
<datalist id="bedienerDatalist">
  <!-- Dynamisch aus LocalStorage gefüllt -->
</datalist>

<div class="container" id="main-form">
  <div class="header-bar">
    <h1>Schichtbuch Bandgalvanik</h1>
    <div class="header-buttons">
      <button type="button" class="btn-personnel" onclick="openPersonnelModal()">
        👥 Personal-Liste
      </button>
      <button type="button" class="btn-archive" onclick="openArchiveModal()">
        📁 Schichtbuch-Archiv
      </button>
    </div>
  </div>

  <div id="editBanner" class="edit-mode-banner">
    ⚠️ Du bearbeitest einen bestehenden Archiv-Eintrag!
    <button type="button" class="btn-cancel-edit" onclick="cancelEditMode()">Bearbeitung abbrechen & neue Schicht starten</button>
  </div>

  <!-- Kopfdaten (Datum & Schicht) -->
  <div class="top-meta-card">
    <div class="top-meta-grid">
      <div>
        <label for="datum">Datum</label>
        <input type="date" id="datum">
      </div>
      <div>
        <label for="schicht">Schicht</label>
        <select id="schicht">
          <option value="Frühschicht">Frühschicht</option>
          <option value="Spätschicht">Spätschicht</option>
          <option value="Nachtschicht">Nachtschicht</option>
        </select>
      </div>
    </div>
  </div>

  <form id="schichtForm">
    <!-- PC Grid: 4 Spalten Nebeneinander -->
    <div class="pc-anlagen-grid">
      <script>
        const anlagen = ['801', '802', '803', '804'];
        const ursachenOptions = `
          <option value="Kein Ausschuss">Kein Ausschuss</option>
          <option value="Bandriss">Bandriss</option>
          <option value="Beschichtungsfehler">Beschichtungsfehler</option>
          <option value="Mechanischer Defekt">Mechanischer Defekt</option>
          <option value="Werkzeug">Werkzeug</option>
          <option value="QS- Prüfung">QS- Prüfung</option>
          <option value="Verbogene Kontakte">Verbogene Kontakte</option>
          <option value="Sonstige">Sonstige</option>
          <option value="Wickelgüte">Wickelgüte</option>
          <option value="Anlagenstillstand">Anlagenstillstand</option>
          <option value="Einstellteile">Einstellteile</option>
          <option value="Haftung">Haftung</option>
          <option value="Unterbrechung">Unterbrechung</option>
        `;

        anlagen.forEach(a => {
          document.write(`
            <div class="anlage-column col-${a}">
              <div class="anlage-header-badge">ANLAGE ${a}</div>
              
              <!-- Produktion & Artikel mit eigenem Bediener -->
              <div class="card">
                <div class="card-title green">Produktion & Artikel</div>
                
                <label for="bediener_${a}">Bediener (Pers.-Nr. / Name)</label>
                <input type="text" id="bediener_${a}" list="bedienerDatalist" placeholder="Pers.-Nr. wählen/tippen" onchange="formatBedienerInput('bediener_${a}')">

                <label style="margin-top:6px;">Gut-Menge (m / Stk)</label>
                <input type="text" id="gut_menge_${a}" placeholder="z. B. 5000">
                
                <div class="grid-2" style="margin-top:3px;">
                  <div>
                    <label>Aktuelle Art.-Nr.</label>
                    <input type="text" id="art_akt_${a}" placeholder="Artikel-Nr.">
                  </div>
                  <div>
                    <label>Folge-Art.-Nr.</label>
                    <input type="text" id="art_folge_${a}" placeholder="Nächste Art.-Nr.">
                  </div>
                </div>
              </div>

              <!-- Ausschuss & Fehler (Einziges Eingabefeld) -->
              <div class="card">
                <div class="card-title red">Ausschuss & Fehler</div>
                
                <div class="grid-2">
                  <div>
                    <label>Ausschuss (m / Stk)</label>
                    <input type="text" id="ausschuss_menge_${a}_1" placeholder="0">
                  </div>
                  <div>
                    <label>Hauptursache</label>
                    <select id="ausschuss_grund_${a}_1">${ursachenOptions}</select>
                  </div>
                </div>
                <label>Details zum Fehler</label>
                <textarea id="ausschuss_details_${a}_1" placeholder="Beschreibung des Fehlers"></textarea>
              </div>

              <!-- Wheels Wartung -->
              <div class="card">
                <div class="card-title orange">Wheels Wartung</div>
                <label class="checkbox-container">
                  <input type="checkbox" id="wartung_${a}">
                  <span>Wheels Wartung durchgeführt</span>
                </label>
              </div>

              <!-- To-Do Folgeschicht -->
              <div class="card">
                <div class="card-title green">To-Do Folgeschicht</div>
                <textarea id="todo_${a}" placeholder="Was muss die nächste Schicht erledigen?"></textarea>
              </div>

              <!-- Stationen & Besonderheiten -->
              <div class="card" style="flex: 1;">
                <div class="card-title">Stationen & Störungen</div>
                <label>Auffälligkeiten an Stationen</label>
                <textarea id="stationen_${a}" placeholder="Abwickeln, Schweißen, Hot Wash, U-Clean..."></textarea>
                <label>Defekte & techn. Störungen</label>
                <textarea id="defekte_${a}" placeholder="Was war defekt?"></textarea>
                <label>Werkzeug / Material / KVP</label>
                <textarea id="material_${a}" placeholder="Bestellungen, fehlende Teile, KVP"></textarea>
              </div>

            </div>
          `);
        });
      </script>
    </div>

    <!-- Symmetrische, zentrierte Buttons -->
    <div class="action-buttons-container">
      <button type="button" id="submitBtn" class="btn-submit" onclick="generateShiftPDF()">
        🖨️ PDF Erstellen & Öffnen
      </button>
      <button type="button" class="btn-reset" onclick="openResetModal()">
        🔄 Schicht zurückstellen / archivieren
      </button>
    </div>
  </form>
</div>

<!-- ARCHIV MODAL -->
<div id="archiveModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Schichtbuch-Archiv</div>
      <button class="modal-close" onclick="closeArchiveModal()">&times;</button>
    </div>
    
    <div class="archive-search-box">
      <label for="archiveSearchDate">🔍 Nach Datum suchen:</label>
      <input type="date" id="archiveSearchDate" onchange="filterArchiveByDate()">
      <button type="button" class="btn-reset-filter" onclick="resetArchiveSearch()">Alle anzeigen</button>
    </div>

    <div class="archive-list" id="archiveList">
      <!-- Dynamische Liste -->
    </div>
  </div>
</div>

<!-- PERSONAL-VERWALTUNG MODAL -->
<div id="personnelModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Personal-Liste verwalten</div>
      <button class="modal-close" onclick="closePersonnelModal()">&times;</button>
    </div>
    
    <!-- Formular zum Hinzufügen -->
    <div class="personnel-add-form">
      <div>
        <label style="margin:0;">Pers.-Nr.</label>
        <input type="text" id="newPersNr" placeholder="z. B. TE543248">
      </div>
      <div>
        <label style="margin:0;">Name</label>
        <input type="text" id="newName" placeholder="z. B. Max Mustermann">
      </div>
      <div style="display:flex; align-items:flex-end;">
        <button type="button" class="btn-add-personnel" onclick="addPersonnelEntry()">+ Hinzufügen</button>
      </div>
    </div>

    <div class="personnel-list" id="personnelList">
      <!-- Dynamische Bedienerliste -->
    </div>
  </div>
</div>

<!-- RESET MODAL -->
<div id="resetModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Formular zurückstellen</div>
      <button class="modal-close" onclick="closeResetModal()">&times;</button>
    </div>
    <p style="font-size:0.88rem; color:var(--text-main); margin-bottom:10px;">
      Möchtest du diese Schicht im Archiv speichern oder das Formular einfach leeren, ohne zu archivieren?
    </p>
    <div class="confirm-actions">
      <button class="btn-modal-action btn-modal-primary" onclick="confirmReset(true)">
        💾 Archivieren & Neues Protokoll starten
      </button>
      <button class="btn-modal-action btn-modal-secondary" onclick="confirmReset(false)">
        🗑️ Nicht archivieren (Nur zurückstellen)
      </button>
      <button class="btn-modal-action btn-modal-cancel" onclick="closeResetModal()">
        Abbrechen
      </button>
    </div>
  </div>
</div>

<div id="pdf-container"></div>

<script>
  let currentEditingArchiveId = null;
  let formHasUnsavedChanges = false;

  // Standard-Personalliste initialisieren
  const defaultPersonnel = [
    { pnr: 'TE543248', name: 'M. Mustermann' },
    { pnr: 'TE123456', name: 'J. Schmidt' },
    { pnr: 'TE987654', name: 'A. Weber' }
  ];

  // Setzt das Datumseingabefeld explizit auf das heutige Tagesdatum
  function setToTodayDate() {
    const datumEl = document.getElementById('datum');
    if (datumEl) {
      datumEl.valueAsDate = new Date();
    }
  }

  // Hilfsfunktion: Wandelt Datumsangaben zuverlässig in YYYY-MM-DD um
  function normalizeDateString(dateStr) {
    if (!dateStr) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  // Prüft, ob ein Eintrag zum gesuchten Datum passt (Schichtdatum ODER Archivierungsdatum)
  function matchesFilterDate(item, filterDateStr) {
    if (!filterDateStr) return true;
    
    const normFilter = normalizeDateString(filterDateStr); // YYYY-MM-DD
    const normShiftDate = normalizeDateString(item.datum); // YYYY-MM-DD
    
    if (normShiftDate === normFilter) return true;
    
    const parts = normFilter.split('-'); // ["YYYY", "MM", "DD"]
    if (parts.length === 3) {
      const year = parts[0];
      const monthWithZero = parts[1];
      const monthNoZero = String(parseInt(parts[1], 10));
      const dayWithZero = parts[2];
      const dayNoZero = String(parseInt(parts[2], 10));

      const deVariant1 = `${dayNoZero}.${monthNoZero}.${year}`; // z.B. 30.7.2026
      const deVariant2 = `${dayWithZero}.${monthWithZero}.${year}`; // z.B. 30.07.2026
      const isoVariant = normFilter; // 2026-07-30

      const ts = item.timestamp || '';
      const shift = item.datum || '';

      if (ts.includes(deVariant1) || ts.includes(deVariant2) || ts.includes(isoVariant)) return true;
      if (shift.includes(deVariant1) || shift.includes(deVariant2) || shift.includes(isoVariant)) return true;
    }

    return false;
  }

  function getPersonnelList() {
    try {
      const list = localStorage.getItem('schichtbuch_personnel');
      if (!list) {
        localStorage.setItem('schichtbuch_personnel', JSON.stringify(defaultPersonnel));
        return defaultPersonnel;
      }
      return JSON.parse(list);
    } catch (e) {
      return defaultPersonnel;
    }
  }

  function updateDatalist() {
    const list = getPersonnelList();
    const datalist = document.getElementById('bedienerDatalist');
    datalist.innerHTML = '';
    list.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.pnr ? `${p.pnr} - ${p.name}` : p.name;
      datalist.appendChild(opt);
    });
  }

  function formatBedienerInput(fieldId) {
    const field = document.getElementById(fieldId);
    if (!field || !field.value) return;

    const val = field.value.trim();
    if (val.includes(' - ')) {
      const parts = val.split(' - ');
      field.value = parts[0].trim();
    }
  }

  function getCurrentFormData() {
    const data = {};
    const inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(el => {
      if (el.id) {
        if (el.type === 'checkbox') {
          data[el.id] = el.checked;
        } else {
          data[el.id] = el.value;
        }
      }
    });
    return data;
  }

  function saveToLocalStorage() {
    const inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(el => {
      if (el.id) {
        if (el.type === 'checkbox') {
          localStorage.setItem('schichtbuch_' + el.id, el.checked ? 'true' : 'false');
        } else {
          localStorage.setItem('schichtbuch_' + el.id, el.value);
        }
      }
    });
    if (currentEditingArchiveId) {
      localStorage.setItem('schichtbuch_current_editing_id', currentEditingArchiveId);
    } else {
      localStorage.removeItem('schichtbuch_current_editing_id');
    }
  }

  function loadFromLocalStorage() {
    const inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(el => {
      if (el.id) {
        const val = localStorage.getItem('schichtbuch_' + el.id);
        if (val !== null) {
          if (el.type === 'checkbox') {
            el.checked = (val === 'true');
          } else {
            el.value = val;
          }
        }
      }
    });
    if (!localStorage.getItem('schichtbuch_datum')) {
      setToTodayDate();
    }

    const savedEditingId = localStorage.getItem('schichtbuch_current_editing_id');
    if (savedEditingId) {
      currentEditingArchiveId = parseInt(savedEditingId, 10);
      updateEditBanner();
    }
  }

  function updateEditBanner() {
    const banner = document.getElementById('editBanner');
    if (currentEditingArchiveId) {
      banner.style.display = 'block';
    } else {
      banner.style.display = 'none';
    }
  }

  function cancelEditMode() {
    currentEditingArchiveId = null;
    localStorage.removeItem('schichtbuch_current_editing_id');
    updateEditBanner();
    alert("Bearbeitungsmodus aufgehoben.");
  }

  function sortArchiveEntries(archive) {
    return archive.sort((a, b) => {
      const dateA = normalizeDateString(a.datum);
      const dateB = normalizeDateString(b.datum);
      if (dateA !== dateB) {
        return dateB.localeCompare(dateA);
      }
      return (b.id || 0) - (a.id || 0);
    });
  }

  function openPersonnelModal() {
    renderPersonnelList();
    document.getElementById('personnelModal').style.display = 'flex';
  }

  function closePersonnelModal() {
    document.getElementById('personnelModal').style.display = 'none';
  }

  function renderPersonnelList() {
    const container = document.getElementById('personnelList');
    container.innerHTML = '';
    const list = getPersonnelList();

    if (list.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:15px; color:var(--text-muted);">Kein Personal hinterlegt.</div>';
    } else {
      list.forEach((p, index) => {
        const el = document.createElement('div');
        el.className = 'personnel-item';
        el.innerHTML = `
          <div>
            <strong style="color:var(--accent-blue);">${p.pnr || 'Keine PNr'}</strong> 
            <span style="margin-left:8px;">${p.name}</span>
          </div>
          <button class="btn-delete-item" onclick="deletePersonnelEntry(${index})">🗑️</button>
        `;
        container.appendChild(el);
      });
    }
  }

  function addPersonnelEntry() {
    const pnrInput = document.getElementById('newPersNr');
    const nameInput = document.getElementById('newName');

    const pnr = pnrInput.value.trim();
    const name = nameInput.value.trim();

    if (!pnr && !name) {
      alert("Bitte gib mindestens eine Personalnummer oder einen Namen ein.");
      return;
    }

    const list = getPersonnelList();
    list.push({ pnr, name });
    localStorage.setItem('schichtbuch_personnel', JSON.stringify(list));

    pnrInput.value = '';
    nameInput.value = '';

    updateDatalist();
    renderPersonnelList();
  }

  function deletePersonnelEntry(index) {
    const list = getPersonnelList();
    list.splice(index, 1);
    localStorage.setItem('schichtbuch_personnel', JSON.stringify(list));
    updateDatalist();
    renderPersonnelList();
  }

  // PRÜFUNG & ARCHIVIERUNG
  function archiveCurrentState() {
    let archive = [];
    try {
      archive = JSON.parse(localStorage.getItem('schichtbuch_archive')) || [];
    } catch (e) { archive = []; }

    const currentData = getCurrentFormData();
    
    const rawDatum = currentData.datum || new Date().toISOString().split('T')[0];
    const datum = normalizeDateString(rawDatum);
    const schicht = currentData.schicht || 'Unbekannt';

    if (currentEditingArchiveId) {
      const index = archive.findIndex(e => e.id === currentEditingArchiveId);
      if (index !== -1) {
        archive[index] = {
          id: currentEditingArchiveId,
          timestamp: new Date().toLocaleString('de-DE') + ' (Bearbeitet)',
          datum: datum,
          schicht: schicht,
          formData: currentData
        };
      } else {
        currentEditingArchiveId = Date.now();
        archive.push({
          id: currentEditingArchiveId,
          timestamp: new Date().toLocaleString('de-DE'),
          datum: datum,
          schicht: schicht,
          formData: currentData
        });
      }
    } else {
      const existingIndex = archive.findIndex(e => normalizeDateString(e.datum) === datum && e.schicht === schicht);

      if (existingIndex !== -1) {
        const overwrite = confirm(
          `Achtung: Für den ${datum} (${schicht}) existiert bereits ein archiviertes Protokoll!\n\nMöchtest du den bestehenden Eintrag überschreiben/aktualisieren?`
        );
        
        if (overwrite) {
          archive[existingIndex] = {
            id: archive[existingIndex].id,
            timestamp: new Date().toLocaleString('de-DE') + ' (Aktualisiert)',
            datum: datum,
            schicht: schicht,
            formData: currentData
          };
          currentEditingArchiveId = archive[existingIndex].id;
        } else {
          return false;
        }
      } else {
        const newId = Date.now();
        const entry = {
          id: newId,
          timestamp: new Date().toLocaleString('de-DE'),
          datum: datum,
          schicht: schicht,
          formData: currentData
        };
        archive.push(entry);
      }
    }

    archive = sortArchiveEntries(archive);
    localStorage.setItem('schichtbuch_archive', JSON.stringify(archive));
    formHasUnsavedChanges = false;
    return true;
  }

  function deleteArchiveEntry(id, e) {
    if (e) e.stopPropagation();

    let archive = [];
    try {
      archive = JSON.parse(localStorage.getItem('schichtbuch_archive')) || [];
    } catch (err) { archive = []; }

    const entry = archive.find(item => item.id === id);
    const label = entry ? `${entry.datum} (${entry.schicht})` : 'diesen Eintrag';

    if (confirm(`Möchtest du ${label} wirklich dauerhaft aus dem Archiv löschen?`)) {
      archive = archive.filter(item => item.id !== id);
      localStorage.setItem('schichtbuch_archive', JSON.stringify(archive));

      if (currentEditingArchiveId === id) {
        cancelEditMode();
      }

      renderArchiveList();
    }
  }

  function renderArchiveList(filterDate = null) {
    const list = document.getElementById('archiveList');
    list.innerHTML = '';

    let archive = [];
    try {
      archive = JSON.parse(localStorage.getItem('schichtbuch_archive')) || [];
    } catch (e) { archive = []; }

    archive = sortArchiveEntries(archive);

    if (filterDate) {
      archive = archive.filter(item => matchesFilterDate(item, filterDate));
    }

    if (archive.length === 0) {
      if (filterDate) {
        list.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">Keine archivierten Schichten für das Datum <b>${filterDate}</b> vorhanden.</div>`;
      } else {
        list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Keine archivierten Schichten vorhanden.</div>';
      }
    } else {
      archive.forEach((item) => {
        const b801 = item.formData ? item.formData['bediener_801'] || '' : '';
        const b802 = item.formData ? item.formData['bediener_802'] || '' : '';
        const b803 = item.formData ? item.formData['bediener_803'] || '' : '';
        const b804 = item.formData ? item.formData['bediener_804'] || '' : '';
        
        const bedienerListe = [b801, b802, b803, b804].filter(b => b.trim() !== '').join(', ') || 'Keine Angaben';

        const el = document.createElement('div');
        el.className = 'archive-item';
        el.innerHTML = `
          <div class="archive-info">
            <div class="archive-date">${item.datum} - ${item.schicht}</div>
            <div style="color:var(--text-muted); font-size:0.75rem;">Bediener: ${bedienerListe}</div>
            <div style="color:#6b7280; font-size:0.7rem;">Archiviert: ${item.timestamp}</div>
          </div>
          <div class="archive-actions">
            <button class="btn-load" onclick="loadArchiveEntry(${item.id})">Laden & Bearbeiten</button>
            <button class="btn-delete-item" title="Löschen" onclick="deleteArchiveEntry(${item.id}, event)">🗑️</button>
          </div>
        `;
        list.appendChild(el);
      });
    }
  }

  function filterArchiveByDate() {
    const searchDate = document.getElementById('archiveSearchDate').value;
    renderArchiveList(searchDate || null);
  }

  function resetArchiveSearch() {
    document.getElementById('archiveSearchDate').value = '';
    renderArchiveList(null);
  }

  function openArchiveModal() {
    const modal = document.getElementById('archiveModal');
    document.getElementById('archiveSearchDate').value = '';
    renderArchiveList(null);
    modal.style.display = 'flex';
  }

  function closeArchiveModal() {
    document.getElementById('archiveModal').style.display = 'none';
  }

  function openResetModal() {
    document.getElementById('resetModal').style.display = 'flex';
  }

  function closeResetModal() {
    document.getElementById('resetModal').style.display = 'none';
  }

  // Korrigiertes Zurückstellen: Setzt das Datum nach dem Leeren wieder verlässlich auf das HEUTIGE Tagesdatum
  function confirmReset(shouldArchive) {
    if (shouldArchive) {
      const success = archiveCurrentState();
      if (!success) return;
    }

    closeResetModal();

    const savedArtAkt = {};
    const savedArtFolge = {};
    const savedBediener = {};

    ['801', '802', '803', '804'].forEach(a => {
      savedArtAkt[a] = formElement(`art_akt_${a}`).value;
      savedArtFolge[a] = formElement(`art_folge_${a}`).value;
      savedBediener[a] = formElement(`bediener_${a}`).value;
    });

    currentEditingArchiveId = null;

    // Formular-Eingaben aus dem LocalStorage bereinigen
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith('schichtbuch_') && key !== 'schichtbuch_archive' && key !== 'schichtbuch_personnel') {
        localStorage.removeItem(key);
      }
    });

    // Formular zurücksetzen
    document.getElementById('schichtForm').reset();
    
    // HEUTIGES DATUM SETZEN
    setToTodayDate();

    // Artikelnummern & Bediener wieder einfügen
    ['801', '802', '803', '804'].forEach(a => {
      formElement(`art_akt_${a}`).value = savedArtAkt[a] || '';
      formElement(`art_folge_${a}`).value = savedArtFolge[a] || '';
      formElement(`bediener_${a}`).value = savedBediener[a] || '';
    });

    saveToLocalStorage();
    updateEditBanner();
    formHasUnsavedChanges = false;

    if (shouldArchive) {
      alert("Schicht wurde archiviert und das Formular für die nächste Schicht auf das heutige Datum zurückgestellt!");
    } else {
      alert("Formular wurde zurückgestellt (ohne zu archivieren).");
    }
  }

  function loadArchiveEntry(id) {
    let archive = [];
    try {
      archive = JSON.parse(localStorage.getItem('schichtbuch_archive')) || [];
    } catch (e) { archive = []; }

    const entry = archive.find(e => e.id === id);
    if (entry && entry.formData) {
      if (confirm(`Möchtest du die Schicht vom ${entry.datum} (${entry.schicht}) laden? Alle Änderungen überschreiben diesen Eintrag im Archiv.`)) {
        Object.keys(entry.formData).forEach(key => {
          const field = document.getElementById(key);
          if (field) {
            if (field.type === 'checkbox') {
              field.checked = Boolean(entry.formData[key]);
            } else {
              field.value = entry.formData[key];
            }
          }
        });
        
        currentEditingArchiveId = id;
        saveToLocalStorage();
        updateEditBanner();
        closeArchiveModal();
        formHasUnsavedChanges = false;
        alert("Eintrag geladen. Wenn du nun Änderungen vornimmst und archivierst/zurückstellst, wird dieser Eintrag aktualisiert.");
      }
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateDatalist();
    loadFromLocalStorage();
    document.querySelectorAll('input, select, textarea').forEach(el => {
      el.addEventListener('input', () => {
        formHasUnsavedChanges = true;
        saveToLocalStorage();
        if (currentEditingArchiveId) archiveCurrentState();
      });
      el.addEventListener('change', () => {
        formHasUnsavedChanges = true;
        saveToLocalStorage();
        if (currentEditingArchiveId) archiveCurrentState();
      });
    });
  });

  window.addEventListener('beforeunload', (e) => {
    if (formHasUnsavedChanges) {
      e.preventDefault();
      e.returnValue = 'Du hast ungespeicherte Änderungen! Möchtest du die Seite wirklich verlassen?';
      return e.returnValue;
    }
  });

  async function generateShiftPDF() {
    const btn = document.getElementById('submitBtn');
    btn.innerText = "Erstelle Schichtblatt...";
    btn.style.opacity = "0.5";

    archiveCurrentState();

    const datumVal = formElement('datum').value || '-';
    const schichtVal = formElement('schicht').value;

    const pdfContainer = document.getElementById('pdf-container');
    pdfContainer.innerHTML = '';

    let anlagenHTML = '';
    ['801', '802', '803', '804'].forEach(a => {
      const bedienerAnlage = formElement(`bediener_${a}`).value || '-';
      const gutMenge = formElement(`gut_menge_${a}`).value || '0';
      const artAkt = formElement(`art_akt_${a}`).value || '-';
      const artFolge = formElement(`art_folge_${a}`).value || '-';
      const todo = (formElement(`todo_${a}`).value || '').trim();
      const stat = (formElement(`stationen_${a}`).value || '').trim();
      const def = (formElement(`defekte_${a}`).value || '').trim();
      const mat = (formElement(`material_${a}`).value || '').trim();
      const wartungGeklickt = formElement(`wartung_${a}`).checked;

      const menge = formElement(`ausschuss_menge_${a}_1`).value || '0';
      const grund = formElement(`ausschuss_grund_${a}_1`).value;
      const det = formElement(`ausschuss_details_${a}_1`).value;

      let ausschussBlockHTML = '';
      if ((menge !== '0' && menge !== '') || grund !== 'Kein Ausschuss' || det !== '') {
        ausschussBlockHTML = `
          <div style="margin-bottom: 3px; padding-bottom: 2px;">
            <b>Menge:</b> <span style="color:#dc2626; font-weight:bold;">${menge}</span> | <b>Ursache:</b> ${grund}
            ${det ? `<br><i>${det}</i>` : ''}
          </div>
        `;
      } else {
        ausschussBlockHTML = '<div class="pdf-val">Kein Ausschuss</div>';
      }

      const wartungBlockHTML = wartungGeklickt ? `
        <div class="pdf-block">
          <div class="pdf-block-title orange">Wheels Wartung</div>
          <div class="pdf-val"><b>Durchgeführt:</b> ✅ Ja</div>
        </div>
      ` : `
        <div class="pdf-block">
          <div class="pdf-block-title orange">Wheels Wartung</div>
          <div class="pdf-val">&nbsp;</div>
        </div>
      `;

      const todoBlockHTML = todo ? `
        <div class="pdf-block">
          <div class="pdf-block-title green">To-Do Folgeschicht</div>
          <div class="pdf-val">${todo}</div>
        </div>
      ` : `
        <div class="pdf-block">
          <div class="pdf-block-title green">To-Do Folgeschicht</div>
          <div class="pdf-val">&nbsp;</div>
        </div>
      `;

      let stoerungenHTML = '';
      if (stat) stoerungenHTML += `<div class="pdf-val"><b>Stationen:</b> ${stat}</div>`;
      if (def) stoerungenHTML += `<div class="pdf-val"><b>Defekte:</b> ${def}</div>`;
      if (mat) stoerungenHTML += `<div class="pdf-val"><b>Material/KVP:</b> ${mat}</div>`;

      const stoerungenBlockHTML = `
        <div class="pdf-block" style="flex: 1;">
          <div class="pdf-block-title">Stationen & Störungen</div>
          ${stoerungenHTML ? stoerungenHTML : '<div class="pdf-val">&nbsp;</div>'}
        </div>
      `;

      anlagenHTML += `
        <div class="pdf-anlage-card">
          <div class="pdf-anlage-title">ANLAGE ${a}</div>
          <div class="pdf-card-body">
            
            <div class="pdf-block">
              <div class="pdf-block-title green">Produktion</div>
              <div class="pdf-val"><b>Bediener:</b> ${bedienerAnlage}</div>
              <div class="pdf-val"><b>Gut-Menge:</b> ${gutMenge}</div>
              <div class="pdf-val"><b>Artikel-Nr:</b> ${artAkt}</div>
              <div class="pdf-val"><b>Folge-Art.:</b> ${artFolge}</div>
            </div>

            <div class="pdf-block">
              <div class="pdf-block-title red">Ausschuss & Ursache</div>
              ${ausschussBlockHTML}
            </div>

            ${wartungBlockHTML}

            ${todoBlockHTML}

            ${stoerungenBlockHTML}

          </div>
        </div>
      `;
    });

    pdfContainer.innerHTML = `
      <div class="pdf-page" id="pdf-shift-page">
        <div class="pdf-header">
          <div>
            <h2>SCHICHTBUCH PROTOKOLL</h2>
            <div style="font-size: 8.5pt; opacity: 0.8;">Bandgalvanik Gesamtbericht</div>
          </div>
          <div class="badge">${schichtVal.toUpperCase()}</div>
        </div>

        <div class="pdf-meta-grid">
          <div class="pdf-meta-item">
            <label>Datum</label>
            <div>${datumVal}</div>
          </div>
          <div class="pdf-meta-item">
            <label>Schicht</label>
            <div>${schichtVal}</div>
          </div>
        </div>

        <div class="pdf-anlagen-grid">
          ${anlagenHTML}
        </div>

        <div class="pdf-footer">
          <span>Schichtbuch Protokoll - Bandgalvanik</span>
          <span>1 Blatt pro Schicht</span>
        </div>
      </div>
    `;

    const pageEl = document.getElementById('pdf-shift-page');
    const canvas = await html2canvas(pageEl, {
      scale: 2,
      useCORS: true,
      logging: false
    });

    const imgData = canvas.toDataURL('image/jpeg', 0.98);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('landscape', 'pt', 'a4');

    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = pdf.internal.pageSize.getHeight();

    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);

    const pdfBlob = pdf.output('blob');
    const pdfUrl = URL.createObjectURL(pdfBlob);

    btn.innerText = "🖨️ PDF Erstellen & Öffnen";
    btn.style.opacity = "1";

    window.location.href = pdfUrl;
  }
</script>
